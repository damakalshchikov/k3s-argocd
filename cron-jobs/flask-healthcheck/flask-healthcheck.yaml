apiVersion: batch/v1
kind: CronJob
metadata:
  name: flask-healthcheck
  namespace: cron-jobs
spec:
  schedule: "*/5 * * * *"
  timeZone: "Europe/Moscow"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 60
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: check
              image: curlimages/curl:8.11.1
              command: ["/bin/sh", "-c"]
              args:
                - |
                  URL=http://simple-flask-service.flask.svc/health/db
                  CODE=$(curl -s -o /tmp/body -w '%{http_code}' --max-time 10 "$URL")
                  echo "$(date -Iseconds) $URL: $CODE $(cat /tmp/body)"
                  [ "$CODE" = "200" ]
              resources:
                requests: { cpu: 10m, memory: 16Mi }
                limits: { cpu: 100m, memory: 64Mi }
